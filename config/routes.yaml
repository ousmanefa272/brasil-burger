# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# This file is the entry point to configure the routes of your app.
# Methods with the #[Route] attribute are automatically imported.
# See also https://symfony.com/doc/current/routing.html

# To list all registered routes, run the following command:
#   bin/console debug:router

# Routes CRUD pour Burger
burger_index:
    path: /burger
    controller: App\Controller\BurgerController::index
    methods: [GET]

burger_new:
    path: /burger/new
    controller: App\Controller\BurgerController::new
    methods: [GET, POST]

burger_edit:
    path: /burger/{id}/edit
    controller: App\Controller\BurgerController::edit
    methods: [GET, POST]

burger_delete:
    path: /burger/{id}/delete
    controller: App\Controller\BurgerController::delete
    methods: [POST]

